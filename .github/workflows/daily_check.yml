name: Daily SOTA Check

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:        # 支持手动触发

jobs:
  check-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update check
        id: check
        env:
          LLM_STATS_API_KEY: ${{ secrets.LLM_STATS_API_KEY }}
        run: |
          python scripts/check_updates.py --ci
          echo "has_updates=$?" >> $GITHUB_OUTPUT
        continue-on-error: true   # exit code 1 表示有更新，不视为 CI 失败

      - name: Regenerate static site
        if: steps.check.outcome == 'failure'   # exit 1 = 有更新
        run: python scripts/generate_site.py

      - name: Create Pull Request
        if: steps.check.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-update/sota-${{ github.run_id }}
          commit-message: "data: auto-update SOTA scores"
          title: "[Auto] SOTA 更新"
          body-path: data/_pr_body.md
          labels: automated-update
          delete-branch: true
