name: Weekly New Benchmark Discovery

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery
        env:
          LLM_STATS_API_KEY: ${{ secrets.LLM_STATS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/discover_new.py --ci
        continue-on-error: true   # exit 1 = 有新发现，不视为失败

      - name: Commit updated known list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/_known_benchmarks.json
          git diff --cached --quiet || git commit -m "chore: update known benchmarks list"
          git push
