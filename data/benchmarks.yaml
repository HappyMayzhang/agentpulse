categories:
- name: 软件工程 Agent
  description: 在真实代码仓库中自主完成 issue 修复、功能开发等软件工程任务
  benchmarks:
  - name: SWE-bench Verified
    description: 真实 GitHub issue 修复任务，Verified 子集经人工验证质量，是 Agent 代码能力的主流标准
    methodology: 给定 issue 描述和代码仓库，Agent 生成可通过所有测试用例的 patch
    sota_score: 95.0%
    sota_model: Claude Fable 5
    sota_date: 2026-06
    source_url: https://arxiv.org/abs/2310.06770
    official_leaderboard: https://www.swebench.com/
    is_self_reported: true
- name: 环境交互 Agent
  description: 在真实操作系统、网页或桌面环境中自主完成多步任务
  benchmarks:
  - name: Terminal-Bench 2.0
    description: 在真实 Linux 环境中完成命令行任务，89 个经人工验证的高难度任务，Docker 沙箱执行
    methodology: Agent 在容器化 Linux 环境中通过 shell 完成任务，程序化状态验证
    sota_score: 82.7%
    sota_model: GPT-5.5
    sota_date: 2026-06
    source_url: https://arxiv.org/abs/2601.11868
    official_leaderboard: https://github.com/harbor-framework/terminal-bench
    is_self_reported: true
  - name: WebArena
    description: CMU 出品，在电商/代码托管/论坛等真实网站完成多步任务的网页交互 Agent 评测
    methodology: Agent 在浏览器中操作真实网站，通过程序化检查验证任务完成情况
    sota_score: 74.3%
    sota_model: Deepseek v3.2
    sota_date: 2026-02
    source_url: https://arxiv.org/abs/2307.13854
    official_leaderboard: https://benchlm.ai/benchmarks/webArena
    is_self_reported: false
  - name: OSWorld
    description: Columbia 出品，在完整虚拟机中完成文件管理/表格/创意软件等桌面任务的 Computer Use Agent 评测
    methodology: Agent 通过截图感知桌面并发出键鼠操作，程序化验证任务完成状态
    sota_score: 78.8%
    sota_model: Seed 2.1 Pro
    sota_date: 2026-07
    source_url: https://arxiv.org/abs/2404.07972
    official_leaderboard: https://llm-stats.com/benchmarks/osworld
    is_self_reported: true
- name: 工具调用 Agent
  description: 评测 Agent 在复杂工具集和真实场景中的多步工具调用与规划能力
  benchmarks:
  - name: Toolathlon
    description: HKUST 出品（ICLR 2026），600+ 工具，真实软件环境中的长链工具调用任务，难度极高
    methodology: 给定工具集和任务目标，评估 Agent 能否通过多步工具调用完成，成功率评分
    sota_score: 73.2%
    sota_model: Kimi K3
    sota_date: 2026-07
    source_url: https://arxiv.org/abs/2510.25726
    official_leaderboard: https://github.com/hkust-nlp/Toolathlon
    is_self_reported: true
  - name: τ-bench
    description: Sierra Research 出品，模拟真实客服场景（零售/航空/银行），Agent 需在多轮对话中遵循政策并调用 API 完成任务
    methodology: 用户由 LLM 模拟，评估工具调用准确率和政策遵循率；pass^k 专门考察一致性
    sota_score: 89.2%
    sota_model: Claude Mythos Preview
    sota_date: 2026-04
    source_url: https://arxiv.org/abs/2406.12045
    official_leaderboard: https://benchlm.ai/benchmarks/tauBench
    is_self_reported: true
- name: 通用 Agent
  description: 需要综合运用推理、工具调用、网页浏览等多种能力完成开放任务
  benchmarks:
  - name: GAIA
    description: Meta 出品，450 道需要多步推理+网页浏览+工具调用的真实问题，答案无歧义，按难度分 3 级
    methodology: Agent 自由使用工具解决问题；裸模型和带脚手架两种设置分数差异显著（+30%），需注明
    sota_score: 93.4%
    sota_model: CustomGPT.ai Research Lab v44
    sota_date: 2026-06
    source_url: https://arxiv.org/abs/2311.12983
    official_leaderboard: https://huggingface.co/spaces/gaia-benchmark/leaderboard
    is_self_reported: true
