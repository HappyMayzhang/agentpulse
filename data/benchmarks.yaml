# Agent Bench Tracker — 核心数据文件
# 所有数据均来自公开来源，详见各 benchmark 官方网站。
# 最后更新：2026-05-28
# sota_score 为当前最佳公开结果，sota_date 为结果公布/记录日期

categories:
  - name: "综合知识"
    description: "综合学科知识和推理能力评测"
    benchmarks:
      - name: "GPQA Diamond"
        description: "研究生级别科学题（生物/化学/物理），专家设计，防数据污染，非专业人员准确率约 34%"
        methodology: "多选题，需要深度专业知识推理"
        sota_score: "94.6%"
        sota_model: "Claude Mythos Preview"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2311.12022"
        official_leaderboard: "https://artificialanalysis.ai/evaluations/gpqa-diamond"

      - name: "HLE"
        description: "Humanity's Last Exam，2500 道极难题目，覆盖数学/科学/人文等数十个领域，专家在各自领域准确率约 90%，设计为当前 AI 无法轻松通过的终极闭卷基准"
        methodology: "多选题 + 开放题，由全球顶尖学者出题，text-only 和多模态两个子集"
        sota_score: "44.7%"
        sota_model: "Gemini 3.1 Pro Preview"
        sota_date: "2026-05-25"
        source_url: "https://arxiv.org/abs/2501.14249"
        official_leaderboard: "https://agi.safe.ai/"

      - name: "MMLU-Pro"
        description: "进阶版 MMLU，题目更难、选项更多（10 选 1），覆盖 14 个学科，减少猜测空间"
        methodology: "多选题，10 个选项，比原版 MMLU 区分度更高"
        sota_score: "89.8%"
        sota_model: "Gemini 3 Pro Preview"
        sota_date: "2026-04"
        source_url: "https://arxiv.org/abs/2406.01574"
        official_leaderboard: "https://benchlm.ai/benchmarks/mmluPro"

  - name: "数学推理"
    description: "数学问题求解与推理能力评测"
    benchmarks:
      - name: "AIME 2025"
        description: "美国数学邀请赛 2025 年题目（I+II，共 30 题），竞赛级难度，是当前区分顶尖模型的核心指标"
        methodology: "填空题，答案为整数（0-999），需要多步推理；pass@1，averaged over 30 problems"
        sota_score: "100.0%"
        sota_model: "Gemini 3 Pro / GPT-5.2 Pro"
        sota_date: "2026-05"
        source_url: "https://artofproblemsolving.com/wiki/index.php/2025_AIME"
        official_leaderboard: "https://artificialanalysis.ai/evaluations/aime-2025"

      - name: "AIME 2026"
        description: "美国数学邀请赛 2026 年题目，是当前最新的竞赛级数学基准，部分顶尖模型已接近满分"
        methodology: "填空题，答案为整数（0-999），pass@1 averaged over 30 problems"
        sota_score: "96.4%"
        sota_model: "Kimi K2.6"
        sota_date: "2026-05"
        source_url: "https://artofproblemsolving.com/wiki/index.php/2026_AIME"
        official_leaderboard: "https://llm-stats.com/benchmarks/aime-2026"

      - name: "AIME 2024"
        description: "美国数学邀请赛 2024 年题目，是 2025 年前模型能力分水岭"
        methodology: "填空题，答案为整数（0-999）"
        sota_score: ""
        sota_model: ""
        sota_date: ""
        source_url: "https://artofproblemsolving.com/wiki/index.php/2024_AIME"
        official_leaderboard: "https://llm-stats.com/benchmarks/aime"

      - name: "GSM8K"
        description: "8500 道小学数学题，用于基础数学推理对比；顶尖模型已接近饱和，保留作为参照基线"
        methodology: "开放式答案，多步算术推理，8-bit 准确率"
        sota_score: ""
        sota_model: ""
        sota_date: ""
        source_url: "https://arxiv.org/abs/2110.14168"
        official_leaderboard: ""

  - name: "代码能力"
    description: "代码生成、修复和软件工程能力评测"
    benchmarks:
      - name: "HumanEval"
        description: "OpenAI 出品，164 道 Python 函数补全题，是代码生成的传统基线，顶尖模型已趋于饱和"
        methodology: "pass@1，给定函数签名和 docstring，生成通过单元测试的代码"
        sota_score: "97.6%"
        sota_model: "Claude Sonnet 4.5"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2107.03374"
        official_leaderboard: "https://pricepertoken.com/leaderboards/benchmark/humaneval"

      - name: "MBPP"
        description: "Google 出品，~374 道 Python 编程题，覆盖算法和标准库使用，与 HumanEval 互补"
        methodology: "pass@1，生成通过测试用例的代码"
        sota_score: "94.9%"
        sota_model: ""
        sota_date: "2026"
        source_url: "https://arxiv.org/abs/2108.07732"
        official_leaderboard: "https://codesota.com/llm/humaneval-mbpp"

      - name: "SWE-bench Verified"
        description: "真实 GitHub issue 修复任务，Verified 子集经人工验证质量，是 Agent 代码能力的新标准"
        methodology: "给定 issue 和代码仓库，生成可通过所有测试用例的 patch"
        sota_score: "93.9%"
        sota_model: "Claude Mythos Preview"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2310.06770"
        official_leaderboard: "https://www.swebench.com/"

      - name: "SciCode"
        description: "科学计算代码生成，覆盖物理/数学/材料等领域，需要领域知识 + 编程能力，难度高"
        methodology: "生成可运行的科学计算代码，通过单元测试验证，包含子问题分解评估"
        sota_score: "58.9%"
        sota_model: "Gemini 3.1 Pro Preview"
        sota_date: "2026-05"
        source_url: "https://scicode-bench.github.io/"
        official_leaderboard: "https://hal.cs.princeton.edu/scicode"

  - name: "Agent/工具调用"
    description: "Agent 任务完成、工具使用和多步规划能力评测"
    benchmarks:
      - name: "Terminal-Bench 2.0"
        description: "在真实 Linux 环境中完成命令行任务，89 个经人工验证的高难度任务，Docker 沙箱执行"
        methodology: "Agent 在容器化 Linux 环境中通过 shell 完成任务，程序化状态验证"
        sota_score: "50.0%"
        sota_model: "Claude Sonnet 4.5"
        sota_date: "2026"
        source_url: "https://arxiv.org/abs/2601.11868"
        official_leaderboard: "https://github.com/harbor-framework/terminal-bench"

      - name: "Toolathlon"
        description: "HKUST 出品（ICLR 2026），600+ 工具，真实软件环境中的长链工具调用任务，难度极高"
        methodology: "给定工具集和任务目标，评估 Agent 能否通过多步工具调用完成，成功率评分"
        sota_score: "38.6%"
        sota_model: "Claude Sonnet 4.5"
        sota_date: "2026"
        source_url: "https://arxiv.org/abs/2510.25726"
        official_leaderboard: "https://github.com/hkust-nlp/Toolathlon"

      - name: "WebArena"
        description: "CMU 出品，真实网页交互 Agent 评测，在电商/代码托管/论坛等真实网站完成任务"
        methodology: "Agent 在浏览器环境中操作真实网站，通过程序化检查或人工验证任务完成情况"
        sota_score: "68.7%"
        sota_model: "Claude Mythos Preview"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2307.13854"
        official_leaderboard: "https://benchlm.ai/benchmarks/webArena"

      - name: "OSWorld"
        description: "Columbia 出品，真实桌面操作 Agent 评测，在完整虚拟机环境中完成文件管理/表格/创意软件等真实任务"
        methodology: "Agent 通过截图感知桌面并发出键鼠操作，程序化验证任务完成状态；含 GUI-only 和 SoM 两种设置"
        sota_score: "72.7%"
        sota_model: "Claude Opus 4.6"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2404.07972"
        official_leaderboard: "https://llm-stats.com/benchmarks/osworld"

      - name: "GAIA"
        description: "Meta 出品，通用 AI 助手评测，450 道需要多步推理+网页浏览+工具调用的真实问题，答案无歧义"
        methodology: "Agent 自由使用工具解决问题，按难度分 3 级；裸模型和带脚手架两种设置分数差异显著"
        sota_score: "52.3%"
        sota_model: "Claude Mythos Preview"
        sota_date: "2026-05"
        source_url: "https://arxiv.org/abs/2311.12983"
        official_leaderboard: "https://huggingface.co/spaces/gaia-benchmark/leaderboard"

      - name: "τ-bench"
        description: "Sierra Research 出品，模拟真实客服场景（零售/航空/银行），Agent 需在多轮对话中遵循政策并调用 API 完成任务"
        methodology: "用户由 LLM 模拟，评估 Agent 在动态对话中的工具调用准确率和政策遵循率；pass^k 考察一致性"
        sota_score: "89.2%"
        sota_model: "Claude Mythos Preview"
        sota_date: "2026-04"
        source_url: "https://arxiv.org/abs/2406.12045"
        official_leaderboard: "https://benchlm.ai/benchmarks/tauBench"

  - name: "指令遵循"
    description: "复杂指令理解和精确遵循能力评测"
    benchmarks:
      - name: "IFEval"
        description: "Google 出品，包含格式/长度/内容等可程序化验证的指令，去除主观评判"
        methodology: "生成满足多个可验证约束的回复，同时报告指令级准确率和提示级准确率"
        sota_score: "92.6%"
        sota_model: ""
        sota_date: "2026"
        source_url: "https://arxiv.org/abs/2311.07911"
        official_leaderboard: ""

  - name: "中文对话"
    description: "中文语言理解、生成与对齐能力评测"
    benchmarks:
      - name: "AlignBench"
        description: "清华出品（ACL 2024），中文大模型对齐评测，覆盖推理/知识/写作等 8 个维度，专注中文场景"
        methodology: "GPT-4 裁判打分（1-10 分），基于规则校准的多维度 LLM-as-Judge + Chain-of-Thought"
        sota_score: ""
        sota_model: ""
        sota_date: ""
        source_url: "https://arxiv.org/abs/2311.18743"
        official_leaderboard: "https://llm-stats.com/benchmarks/alignbench"
